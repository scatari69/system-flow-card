name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Browser regression checks
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/system-flow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8766/demo/ >/dev/null
          for query in test 'editor&test'; do
            google-chrome --headless --no-sandbox --disable-gpu --no-first-run --user-data-dir=/tmp/system-flow-ci --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8766/demo/?$query" > /tmp/system-flow-result.html
            grep -q 'data-test-result="passed"' /tmp/system-flow-result.html || { cat /tmp/system-flow-result.html; exit 1; }
          done
