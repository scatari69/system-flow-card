name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.1; update package.json version first)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Publish HACS bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          gh release create "$RELEASE_TAG" dist/system-flow-card.js --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
